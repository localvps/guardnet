# coturn TURN server configuration for GuardNet
# Docs: https://github.com/coturn/coturn

# Listener port (UDP/TCP)
listening-port=3478

# TLS listening port (optional, for TURNS)
# tls-listening-port=5349

# Relay port range (UDP)
min-relay-port=49160
max-relay-port=49200

# Use fingerprint in TURN message
fingerprint

# Long-term credential mechanism
lt-cred-mech

# Realm (must match WEBRTC_TURN_REALM in .env)
realm=guardnet.local

# Static user (must match WEBRTC_TURN_USER / WEBRTC_TURN_PASS in .env)
user=guardnet:changeme

# Total relay threads
relay-threads=2

# Uncomment for external IP (set to your server's public IP)
# external-ip=YOUR_PUBLIC_IP

# Logging
log-file=stdout
verbose

# Disable CLI
no-cli

# Disable multicast peers
no-multicast-peers

# Deny private/local IPs as peers (prevents SSRF)
no-loopback-peers
no-tcp-relay
